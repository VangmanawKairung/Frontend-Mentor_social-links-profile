name: Deploy React site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# กำหนด Permissions ให้ Actions สามารถเขียนข้อมูลลง GitHub Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ ถ้าใช้ Vite ให้ระบุเป็น 'dist'
          # ⚠️ ถ้าใช้ Create React App ให้เปลี่ยนตรงนี้เป็น 'build'
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
